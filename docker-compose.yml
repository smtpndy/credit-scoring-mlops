
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-fraud-api
    ports:
      - "8000:8000"
    volumes:
      - credit_fraud_artifacts:/app/artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: credit-fraud-dashboards
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  credit_fraud_artifacts:
